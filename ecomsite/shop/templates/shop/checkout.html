{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.js" integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
    <title>Checkout</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                
                <ul class="list-group" id="ItemList">

                    {% comment %} <li class="list-group-item d-flex justify-content-between align-items-center">
                        Total Items
                        <span class="badge badge-primary badge-pill" id="totalItems">0</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Total Price
                        <span class="badge badge-primary badge-pill" id="totalPrice">$0.00</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Shipping
                        <span class="badge badge-primary badge-pill" id="shippingCost">$0.00</span>
                    </li> {% endcomment %}
                </ul>
                
            </div>
        </div>
        <div class = "row">
            <div class="col-md-12">
                <form method= "POST">
                    {% csrf_token %}
                    <input type="hidden" name="items" id="Items">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                        <label for="inputEmail4">Name</label>
                        <input id="Name" name="name" type="text" class="form-control" id="inputEmail4" placeholder="Name">
                        </div>
                        <div class="form-group col-md-6">
                        <label for="inputPassword4">Email</label>
                        <input type="email"  id="Email" name="email" class="form-control" id="inputPassword4" placeholder="Email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="inputAddress">Address</label>
                        <input id="Address" name="address" type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                        <label for="inputCity">City</label>
                        <input id="City" name="city" type="text" class="form-control" id="inputCity">
                        </div>
                        <div class="form-group col-md-4">
                        <label for="inputState">State</label>
                        <input id="State" name="state" type="text" class="form-control" id="inputState">
                        </div>
                        <div class="form-group col-md-2">
                        <label for="inputZip">Zip</label>
                        <input id="ZipCode" name="zipcode" type="text" class="form-control" id="inputZip">
                        </div>
                        <div class="form-group col-md-2">
                        <label for="inputZip">Amount to be paid</label>
                        <input readonly="" name="total" type="text" class="form-control" id="total">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Place Order</button>
                </form>
            </div>
        </div>
    </div>
</body>
<script type="text/javascript">
    if(localStorage.getItem('cart') === null){
        var cart = {};
    }
    else{
        cart = JSON.parse(localStorage.getItem('cart'));
    }

    let total = 0;

    for(item in cart){
        let name = cart[item][1];
        let quantity = cart[item][0];
        let price = cart[item][2];

        total = total + cart[item][2];
        

        itemString = `<li class="list-group-item"><span class="">${quantity}</span> of ${name} <span class= "badge badge-warning badge-pill">$${price}</span></li>`;
        
        $('#ItemList').append(itemString);
    }

    totalPrice = `<li class= "list-group-item d-flex justify-content-between align-items-center">Total Price <span class="badge badge-primary badge-pill"><b>$${total.toFixed(2)}</b></span></li>`;
    $('#total').val(total);
    $('#ItemList').append(totalPrice);
    $('#Items').val(JSON.stringify(cart));
</script>
</html>
